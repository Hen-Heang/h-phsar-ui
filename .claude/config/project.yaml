# project — 샘플 TypeScript 워크스페이스 프로젝트 정의
#
# 단일 출처(Single Source of Truth) — 스킬·에이전트가 본 파일을 Read 하여
# {{config.xxx}} 치환 및 프로젝트 메타 결정에 사용한다.
#
# 경로 규칙: 본 파일 위치는 .claude/config/project.yaml (워크스페이스 루트 기준).
#
# 관심사 분리:
#   - 프로젝트 정체성(본 파일): projects / tracing / commonUtils / db / references
#   - 툴 동작·연동 설정: .claude/config/system.yaml
#   - 스코프 데이터: .claude/config/scope.yaml
#
# 변수 참조:
#   {{config.workspaceName}}, {{config.outputDir}}, {{config.db.vendor}}
#   {{config.projects[]}}, {{config.commonUtilsArtifact}}, {{config.tracing.mdcKey}}, ...
#
# DB vendor enum: postgres / mysql / oracle

# ---------------------------------------------------------------------------
# 워크스페이스 메타
# ---------------------------------------------------------------------------

workspaceName: h-phsar-ui
outputDir: target/works     # 영속 작업 산출물 루트: 브리프는 바로 아래, 계획서는 plans/{task}/
tempDir: target/tmp          # 선탐색 임시 (자동 .gitignore 권장)
planSkill: dev-plan           # 후속 스킬 키 (references/completion-hooks.md 참조)

# ---------------------------------------------------------------------------
# 패키지·아티팩트 명명
# ---------------------------------------------------------------------------

# TypeScript 환경에서는 Java 패키지 경로가 없으므로 npm 패키지 명명 규칙 사용
baseNamespacePattern: @/*
commonUtilsArtifact: 
commonUtilsAutoInclude: 
commonUtilsPackage: 

# ---------------------------------------------------------------------------
# 추적 (분산 추적 컨텍스트 키)
# ---------------------------------------------------------------------------

tracing:
  mdcKey: x-track-uuid

# ---------------------------------------------------------------------------
# 프로젝트 인벤토리
# ---------------------------------------------------------------------------

projects:
  - name: h-phsar-ui
    shortName: ui
    multiModule: false
    role: H-Phsar 프론트엔드 — Next.js 기반, Buyer/Supplier/Admin 역할별 화면을 제공하며 h-phsar-api REST API와 통신한다.
    guideline:
      backend: docs/guideline/guide-nextjs.md
      frontend: docs/guideline/guide-react.md

# ---------------------------------------------------------------------------
# 사용자 정의 문서
# ---------------------------------------------------------------------------

customDocs:
  antiPatterns: 
  devGuide: 

# ---------------------------------------------------------------------------
# DB 메타
# ---------------------------------------------------------------------------

db:
  vendor: postgres
  schema: 
  searchPathEnabled: true    # true 면 mapper/SQL 에 스키마 접두사 미부착
  codePattern: '^([A-Z0-9]+)\s*[:：]\s*(.+)$'
  codeSeparator: ","

# ---------------------------------------------------------------------------
# code-review 동작 knob
#   소비처: /code-review · code-reviewer · mr-reviewer
# ---------------------------------------------------------------------------

codeReview:
  defaultLang: ko            # ko / en
  defaultTarget: staged      # staged / unstaged / HEAD~N / branch
  maxFiles: 30               # 하드 커트오프 — 최대 분석 파일 수
  maxLinesPerFile: 500       # 파일당 최대 분석 라인

# ---------------------------------------------------------------------------
# 기능 토글
# ---------------------------------------------------------------------------

features:
  scope:
    enabled: false           # true -> 스코프 식별·allowedPaths 제한(scope.yaml 필요) / false -> 전체 소스 기준

# ---------------------------------------------------------------------------
# Stage 2 정성 검토자 (dev-interview 등 브리프 파이프라인)
#   none -> Stage 2 skip / codex:rescue / claude-sonnet / 기타 subagent 위임
# ---------------------------------------------------------------------------

reviewerAgent: none

# ---------------------------------------------------------------------------
# 변경 안내
#
# 1. projects[] 변경    — 즉시 반영 (Phase 0-1 1번 선택지 변경).
# 2. db.vendor 변경     — docs/agents/db-meta-manager/templates/{table-search,column-meta}.{vendor}.sql
#                         동일 vendor 분기 SQL 로 교체 필요.
# 3. tracing.mdcKey 변경 — 전체 로그·비동기 전파 키 일괄 변경.
# ---------------------------------------------------------------------------
